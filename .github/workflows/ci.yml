name: Ferris checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install -e '.[train]'
      - run: python -m unittest discover -s tests -v
      - run: node tools/browser_smoke.mjs
        env:
          CHROMIUM: google-chrome
          PYTHON_BIN: python
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 diagnostic firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware
          idf.py set-target esp32
          idf.py build
