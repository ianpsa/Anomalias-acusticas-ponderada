[project]
name = "ferris-assistant"
version = "0.1.0"
description = "Assistente de voz Ferris com detector embarcado FreeRTOS e LM Studio"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
train = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "onnx>=1.16,<2", "onnxruntime>=1.18,<2"]
voice = ["faster-whisper>=1.1,<2"]
device = ["pyserial>=3.5,<4"]
tts = ["supertonic==1.3.1"]

[project.scripts]
ferris = "ferris.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ferris*"]

[tool.setuptools.package-data]
ferris = ["static/*"]
