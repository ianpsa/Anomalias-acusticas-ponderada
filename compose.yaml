name: ferris

services:
  ferris:
    build:
      context: .
      target: ferris
    init: true
    restart: unless-stopped
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "127.0.0.1:${PANEL_PORT:-8765}:8765"
    environment:
      PANEL_PORT: "8765"
      AI_PROCESSOR_URL: ${AI_PROCESSOR_URL:-http://192.168.15.17:1234/v1}
      AI_PROCESSOR_MODEL: ${AI_PROCESSOR_MODEL:-google/gemma-4-12b-qat}
      AI_PROCESSOR_KEY: ${AI_PROCESSOR_KEY:-}
      VOICE_URL: ${VOICE_URL:-http://192.168.15.17:8770/v1}
      VOICE_TOKEN: ${VOICE_TOKEN:-}
      PANEL_TOKEN: ${PANEL_TOKEN:-}
      DEVICE_TOKEN: ${DEVICE_TOKEN:-}
      SEARCH_KEY: ${SEARCH_KEY:-}
      FLASH_ENABLED: "0"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "ferris"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  voice:
    profiles: [voice]
    build:
      context: .
      target: voice
    init: true
    restart: unless-stopped
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    ports:
      - "${VOICE_BIND:-0.0.0.0}:${VOICE_PORT:-8770}:8770"
    environment:
      VOICE_PORT: "8770"
      VOICE_BIND: 0.0.0.0
      VOICE_TOKEN: ${VOICE_TOKEN:-}
      VOICE_THREADS: ${VOICE_THREADS:-4}
      VOICE_SPLIT_SENTENCES: ${VOICE_SPLIT_SENTENCES:-0}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "voice"]
      interval: 30s
      timeout: 5s
      start_period: 30m

  firmware:
    profiles: [tools]
    image: espressif/idf:v5.4.2
    user: "${USER_ID:-1000}:${GROUP_ID:-1000}"
    environment:
      HOME: /tmp
      FLASH_PORT: /dev/ttyUSB0
    devices:
      - "${SERIAL_PORT:-/dev/ttyUSB0}:/dev/ttyUSB0"
    group_add:
      - "${SERIAL_GID:-0}"
    volumes:
      - ./firmware:/source:ro
      - ./models:/models:ro
      - ./docker/flash.sh:/flash.sh:ro
    working_dir: /tmp
    command: ["bash", "/flash.sh"]

  test:
    profiles: [tools]
    build:
      context: .
      target: test
    init: true
