name: ferris

services:
  ferris:
    build:
      context: .
      target: ferris
    init: true
    restart: unless-stopped
    user: "${FERRIS_UID:-1000}:${FERRIS_GID:-1000}"
    ports:
      - "127.0.0.1:${FERRIS_PORT:-8765}:8765"
    environment:
      LM_STUDIO_URL: ${LM_STUDIO_URL:-http://192.168.15.17:1234/v1}
      LM_STUDIO_MODEL: ${LM_STUDIO_MODEL:-google/gemma-4-12b-qat}
      LM_STUDIO_KEY: ${LM_STUDIO_KEY:-}
      FERRIS_VOICE_URL: ${FERRIS_VOICE_URL:-http://192.168.15.17:8770/v1}
      FERRIS_VOICE_TOKEN: ${FERRIS_VOICE_TOKEN:-}
      FERRIS_TOKEN: ${FERRIS_TOKEN:-}
      FERRIS_DEVICE_TOKEN: ${FERRIS_DEVICE_TOKEN:-}
      SERPAPI_KEY: ${SERPAPI_KEY:-}
      FERRIS_FLASH_ENABLED: "0"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "ferris"]
      interval: 30s
      timeout: 5s
      start_period: 10s

  voice:
    profiles: [voice]
    build:
      context: .
      target: voice
    init: true
    restart: unless-stopped
    user: "${FERRIS_UID:-1000}:${FERRIS_GID:-1000}"
    ports:
      - "${FERRIS_VOICE_BIND:-0.0.0.0}:${FERRIS_VOICE_PORT:-8770}:8770"
    environment:
      FERRIS_VOICE_TOKEN: ${FERRIS_VOICE_TOKEN:-}
      QWEN_INTRA_THREADS: ${QWEN_INTRA_THREADS:-4}
      FERRIS_TTS_SENTENCE_CHUNKS: ${FERRIS_TTS_SENTENCE_CHUNKS:-0}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "/app/docker/healthcheck.py", "voice"]
      interval: 30s
      timeout: 5s
      start_period: 30m

  firmware:
    profiles: [tools]
    image: espressif/idf:v5.4.2
    user: "${FERRIS_UID:-1000}:${FERRIS_GID:-1000}"
    environment:
      HOME: /tmp
      FERRIS_FLASH_PORT: /dev/ttyUSB0
    devices:
      - "${FERRIS_SERIAL_PORT:-/dev/ttyUSB0}:/dev/ttyUSB0"
    group_add:
      - "${FERRIS_SERIAL_GID:-0}"
    volumes:
      - ./firmware:/source:ro
      - ./models:/models:ro
      - ./docker/flash.sh:/flash.sh:ro
    working_dir: /tmp
    command: ["bash", "/flash.sh"]

  test:
    profiles: [tools]
    build:
      context: .
      target: test
    init: true
