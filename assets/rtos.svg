<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc">
 <title id="title">Ferris: tarefas FreeRTOS e integração com o PC</title>
 <desc id="desc">Captura I2S entrega blocos ao ring buffer; features mantém uma janela circular e envia vetores por fila; detecção aciona LED e enfileira eventos para rede. O PC usa esses eventos para saudar e envia perguntas de texto ao Gemma no LM Studio local. Seção crítica curta protege contadores; nenhuma espera de rede bloqueia a captura.</desc>
 <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9" fill="none" stroke="#315e68" stroke-width="1.6"/></marker></defs>
 <style>text{font-family:Arial,sans-serif;fill:#283e47}.h{font-size:26px;font-weight:bold}.sub{font-size:15px;fill:#566a72}.label{font-size:18px;font-weight:bold}.body{font-size:15px}.tiny{font-size:13px;fill:#566a72}.box{fill:#fff;stroke:#c5d5d8;stroke-width:2}.queue{fill:#e4f0ec;stroke:#357461;stroke-width:1.5}.line{fill:none;stroke:#315e68;stroke-width:2;marker-end:url(#arrow)}</style>
 <rect width="1280" height="850" rx="24" fill="#f3f8f8"/>
 <text x="40" y="48" class="h">Ferris: áudio na borda, conversa no PC</text>
 <text x="40" y="76" class="sub">ESP32 original · INMP441 · FreeRTOS · janelas de 1 segundo, salto de 250 ms</text>
 <rect x="30" y="102" width="1220" height="452" rx="20" fill="#dfeaec"/>
 <text x="52" y="137" class="label">ESP32: a detecção continua mesmo sem rede</text>
 <rect x="50" y="166" width="240" height="174" rx="14" class="box"/>
 <text x="70" y="198" class="label">Captura · prioridade 5</text>
 <text x="70" y="228" class="body">INMP441 → I2S + DMA</text><text x="70" y="254" class="body">800 amostras / bloco</text>
 <text x="70" y="280" class="body">PCM16 mono · 16 kHz</text><text x="70" y="313" class="tiny">Leitura bloqueia só esta tarefa</text>
 <rect x="360" y="166" width="260" height="174" rx="14" class="box"/>
 <text x="380" y="198" class="label">Features · prioridade 3</text>
 <text x="380" y="228" class="body">Janela circular: 16.000 amostras</text><text x="380" y="254" class="body">RMS + centroide + 13 MFCCs</text>
 <text x="380" y="280" class="body">10 bins temporais → 150 floats</text><text x="380" y="313" class="tiny">Devolve bloco antes de calcular</text>
 <rect x="690" y="166" width="250" height="174" rx="14" class="box"/>
 <text x="710" y="198" class="label">Detecção · prioridade 2</text>
 <text x="710" y="228" class="body">Pesos equivalentes ao ONNX</text><text x="710" y="254" class="body">2 confirmações consecutivas</text>
 <text x="710" y="280" class="body">Cooldown: 3 s · pulso: 300 ms</text><text x="710" y="313" class="tiny">Sem espera por HTTP</text>
 <rect x="1010" y="166" width="220" height="174" rx="14" class="box"/>
 <text x="1030" y="198" class="label">Rede · prioridade 1</text>
 <text x="1030" y="228" class="body">USB + HTTP → PC</text><text x="1030" y="254" class="body">HTTP: timeout 2 s</text>
 <text x="1030" y="280" class="body">Token do dispositivo</text><text x="1030" y="313" class="tiny">Sem replay de evento antigo</text>
 <path d="M290 250H358" class="line"/><path d="M620 250H688" class="line"/><path d="M940 250H1008" class="line"/>
 <rect x="170" y="366" width="270" height="72" rx="10" class="queue"/><text x="186" y="391" class="body">Ring buffer NO-SPLIT</text><text x="186" y="415" class="tiny">Envio sem espera; propriedade temporária</text>
 <path d="M320 366V266" fill="none" stroke="#357461" stroke-dasharray="4 4"/>
 <rect x="512" y="366" width="260" height="72" rx="10" class="queue"/><text x="530" y="391" class="body">Fila: 3 vetores de features</text><text x="530" y="415" class="tiny">Cópia por valor; receptor bloqueante</text>
 <path d="M653 366V266" fill="none" stroke="#357461" stroke-dasharray="4 4"/>
 <rect x="870" y="366" width="240" height="72" rx="10" class="queue"/><text x="888" y="391" class="body">Fila: 4 eventos de ativação</text><text x="888" y="415" class="tiny">Cópia por valor; envio sem espera</text>
 <path d="M976 366V266" fill="none" stroke="#357461" stroke-dasharray="4 4"/>
 <text x="54" y="480" class="body">Sobrecarga: descarta bloco novo e conta perdas. Lacunas de sequência reiniciam janelas e confirmações.</text>
 <text x="54" y="509" class="body">Contadores: seção crítica curta (portMUX). Rede: Event Group de Wi-Fi. Filas/ring: sincronização interna FreeRTOS.</text>
 <text x="54" y="534" class="tiny">Nenhum lock de aplicação é mantido durante I2S, DSP ou HTTP. Janela circular acessada apenas pela tarefa de features.</text>
 <rect x="50" y="604" width="740" height="164" rx="16" class="box"/>
 <text x="73" y="637" class="label">PC local: serviço Ferris + painel aberto</text>
 <text x="73" y="666" class="body">Evento do ESP32 → saudação contextual → saída de áudio do PC</text>
 <text x="73" y="692" class="body">Microfone do PC → Whisper local → Gemma no LM Studio → voz no PC</text>
 <text x="73" y="719" class="body">Alternativa sem placa: detector ONNX + Whisper no próprio PC</text>
 <text x="73" y="747" class="tiny">Painel treina e grava o detector no ESP32 por USB. Whisper e Gemma ficam no PC.</text>
 <rect x="880" y="604" width="350" height="164" rx="16" class="box"/>
 <text x="904" y="637" class="label">Mesmo PC: LM Studio + Gemma</text>
 <text x="904" y="671" class="body">Recebe texto, devolve resposta</text><text x="904" y="702" class="body">API local: 127.0.0.1:1234/v1</text>
 <text x="904" y="738" class="tiny">Serviço separado; conexão pela LAN opcional</text>
 <path d="M1140 340V575H470V602" class="line"/>
 <path d="M790 658H878" class="line"/><path d="M880 715H792" class="line"/>
 <text x="50" y="791" class="body">Controles · prioridade 4: botão 23 alterna mute; vermelho 18 / verde 19. Cada clique invalida a geração anterior de áudio.</text>
 <text x="50" y="824" class="tiny">Modelo: treino no PC → wake.onnx + pesos C. Mesmo frontend DSP em ambos. Alerta local funciona sem PC após treinar e gravar.</text>
</svg>
